<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Architecture cover image</title>
  <desc id="desc">Abstract cover showing layered agent architecture: memory, tools, orchestration, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050F1A"/>
      <stop offset="1" stop-color="#0A2A3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="796" y1="72" x2="1062" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#071824" stroke="#1A4F6A" stroke-width="2"/>

  <!-- Left: architecture stack -->
  <!-- Orchestration (top, widest — owns the loop) -->
  <rect x="104" y="100" width="460" height="64" rx="10" fill="#122B3F" stroke="#22D3EE" stroke-width="2"/>
  <text x="334" y="128" text-anchor="middle" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ORCHESTRATION</text>
  <text x="334" y="150" text-anchor="middle" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="11">loop · state · error recovery · termination</text>

  <!-- Arrow down -->
  <line x1="334" y1="164" x2="334" y2="180" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Model + Memory side by side -->
  <rect x="104" y="180" width="210" height="64" rx="10" fill="#0F3348" stroke="#67E8F9" stroke-width="2"/>
  <text x="209" y="208" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MODEL</text>
  <text x="209" y="228" text-anchor="middle" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="11">reasoning engine</text>

  <rect x="354" y="180" width="210" height="64" rx="10" fill="#0F3348" stroke="#67E8F9" stroke-width="2"/>
  <text x="459" y="208" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MEMORY</text>
  <text x="459" y="228" text-anchor="middle" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="11">context · episodic · semantic</text>

  <!-- Arrow down -->
  <line x1="334" y1="244" x2="334" y2="260" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Tools layer -->
  <rect x="104" y="260" width="460" height="64" rx="10" fill="#0F3348" stroke="#A3E635" stroke-width="2"/>
  <text x="334" y="288" text-anchor="middle" fill="#A3E635" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">TOOLS</text>
  <text x="334" y="310" text-anchor="middle" fill="#8CC432" font-family="Arial, Helvetica, sans-serif" font-size="11">APIs · functions · RAG · external services</text>

  <!-- Arrow down -->
  <line x1="334" y1="324" x2="334" y2="340" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Observability layer -->
  <rect x="104" y="340" width="460" height="64" rx="10" fill="#0F3348" stroke="#BEF264" stroke-width="2"/>
  <text x="334" y="368" text-anchor="middle" fill="#BEF264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">OBSERVABILITY</text>
  <text x="334" y="390" text-anchor="middle" fill="#8CC432" font-family="Arial, Helvetica, sans-serif" font-size="11">traces · metrics · alerts · audit trail</text>

  <!-- Right: pattern cards -->
  <text x="660" y="108" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ORCHESTRATION PATTERNS</text>

  <rect x="656" y="122" width="420" height="64" rx="8" fill="#0D2030" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="672" y="148" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ReAct</text>
  <text x="672" y="168" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">Thought → Action → Observation, per iteration.</text>
  <text x="672" y="182" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">Auditable. Expensive. Best for unpredictable tasks.</text>

  <rect x="656" y="198" width="420" height="64" rx="8" fill="#0D2030" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="672" y="224" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Chain-of-Thought</text>
  <text x="672" y="244" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">Plan upfront, then execute. Human checkpoint</text>
  <text x="672" y="258" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">before actions fire. Brittle on dynamic data.</text>

  <rect x="656" y="274" width="420" height="64" rx="8" fill="#0D2030" stroke="#A3E635" stroke-width="1.5"/>
  <text x="672" y="300" fill="#A3E635" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Hierarchical</text>
  <text x="672" y="320" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">Planner decomposes → workers execute.</text>
  <text x="672" y="334" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">Lean context per level. High debug complexity.</text>

  <rect x="656" y="350" width="420" height="64" rx="8" fill="#0D2030" stroke="#BEF264" stroke-width="1.5"/>
  <text x="672" y="376" fill="#BEF264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Hybrid (production default)</text>
  <text x="672" y="396" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">Hierarchical outer loop · ReAct sub-tasks ·</text>
  <text x="672" y="410" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="11">CoT plan-confirm for high-stakes steps.</text>

  <!-- Accent badge -->
  <rect x="796" y="72" width="244" height="46" rx="23" fill="url(#accent)"/>
  <text x="918" y="101" text-anchor="middle" fill="#071824" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PART 2 OF 2</text>

  <!-- Main headline -->
  <text x="104" y="460" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">MEMORY · TOOLS · ORCHESTRATION</text>
  <text x="104" y="528" fill="#F4FEFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">AI Agent</text>
  <text x="104" y="588" fill="#F4FEFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Architecture</text>
</svg>
