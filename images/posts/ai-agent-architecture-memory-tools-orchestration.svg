<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Architecture cover image</title>
  <desc id="desc">Abstract cover showing layered agent architecture: memory, tools, orchestration, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F0A00"/>
      <stop offset="1" stop-color="#1E1400"/>
    </linearGradient>
    <linearGradient id="accent" x1="796" y1="72" x2="1062" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#160E00" stroke="#4A3000" stroke-width="2"/>

  <!-- Left: architecture stack -->
  <!-- Orchestration -->
  <rect x="104" y="100" width="460" height="64" rx="10" fill="#2A1800" stroke="#F97316" stroke-width="2"/>
  <text x="334" y="128" text-anchor="middle" fill="#F97316" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ORCHESTRATION</text>
  <text x="334" y="150" text-anchor="middle" fill="#B85A10" font-family="Arial, Helvetica, sans-serif" font-size="11">loop · state · error recovery · termination</text>

  <line x1="334" y1="164" x2="334" y2="180" stroke="#F97316" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Model + Memory -->
  <rect x="104" y="180" width="210" height="64" rx="10" fill="#1E1200" stroke="#FB923C" stroke-width="2"/>
  <text x="209" y="208" text-anchor="middle" fill="#FB923C" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MODEL</text>
  <text x="209" y="228" text-anchor="middle" fill="#B85A10" font-family="Arial, Helvetica, sans-serif" font-size="11">reasoning engine</text>

  <rect x="354" y="180" width="210" height="64" rx="10" fill="#1E1200" stroke="#FB923C" stroke-width="2"/>
  <text x="459" y="208" text-anchor="middle" fill="#FB923C" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MEMORY</text>
  <text x="459" y="228" text-anchor="middle" fill="#B85A10" font-family="Arial, Helvetica, sans-serif" font-size="11">context · episodic · semantic</text>

  <line x1="334" y1="244" x2="334" y2="260" stroke="#F97316" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Tools -->
  <rect x="104" y="260" width="460" height="64" rx="10" fill="#1E1200" stroke="#FBBF24" stroke-width="2"/>
  <text x="334" y="288" text-anchor="middle" fill="#FBBF24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">TOOLS</text>
  <text x="334" y="310" text-anchor="middle" fill="#B08010" font-family="Arial, Helvetica, sans-serif" font-size="11">APIs · functions · RAG · external services</text>

  <line x1="334" y1="324" x2="334" y2="340" stroke="#F97316" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Observability -->
  <rect x="104" y="340" width="460" height="64" rx="10" fill="#1E1200" stroke="#FCD34D" stroke-width="2"/>
  <text x="334" y="368" text-anchor="middle" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">OBSERVABILITY</text>
  <text x="334" y="390" text-anchor="middle" fill="#B08010" font-family="Arial, Helvetica, sans-serif" font-size="11">traces · metrics · alerts · audit trail</text>

  <!-- Right: pattern cards -->
  <text x="660" y="108" fill="#B85A10" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ORCHESTRATION PATTERNS</text>

  <rect x="656" y="122" width="420" height="64" rx="8" fill="#1A1000" stroke="#F97316" stroke-width="1.5"/>
  <text x="672" y="148" fill="#F97316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ReAct</text>
  <text x="672" y="168" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">Thought → Action → Observation, per iteration.</text>
  <text x="672" y="182" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">Auditable. Expensive. Best for unpredictable tasks.</text>

  <rect x="656" y="198" width="420" height="64" rx="8" fill="#1A1000" stroke="#FB923C" stroke-width="1.5"/>
  <text x="672" y="224" fill="#FB923C" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Chain-of-Thought</text>
  <text x="672" y="244" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">Plan upfront, then execute. Human checkpoint</text>
  <text x="672" y="258" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">before actions fire. Brittle on dynamic data.</text>

  <rect x="656" y="274" width="420" height="64" rx="8" fill="#1A1000" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="672" y="300" fill="#FBBF24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Hierarchical</text>
  <text x="672" y="320" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">Planner decomposes → workers execute.</text>
  <text x="672" y="334" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">Lean context per level. High debug complexity.</text>

  <rect x="656" y="350" width="420" height="64" rx="8" fill="#1A1000" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="672" y="376" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Hybrid (production default)</text>
  <text x="672" y="396" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">Hierarchical outer loop · ReAct sub-tasks ·</text>
  <text x="672" y="410" fill="#D4A070" font-family="Arial, Helvetica, sans-serif" font-size="11">CoT plan-confirm for high-stakes steps.</text>

  <!-- Accent badge -->
  <rect x="796" y="72" width="244" height="46" rx="23" fill="url(#accent)"/>
  <text x="918" y="101" text-anchor="middle" fill="#0F0A00" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PART 2 OF 2</text>

  <!-- Main headline -->
  <text x="104" y="460" fill="#B85A10" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">MEMORY · TOOLS · ORCHESTRATION</text>
  <text x="104" y="528" fill="#FFF8F0" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">AI Agent</text>
  <text x="104" y="588" fill="#FFF8F0" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Architecture</text>
</svg>
