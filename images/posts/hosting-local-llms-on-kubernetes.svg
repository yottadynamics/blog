<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hosting Local LLMs on Kubernetes cover image</title>
  <desc id="desc">Abstract cover with layered GPU compute nodes, inference stack, and enterprise architecture headline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050F1A"/>
      <stop offset="1" stop-color="#0A2A3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="796" y1="72" x2="1062" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="gpugrad" x1="680" y1="160" x2="1060" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F3348"/>
      <stop offset="1" stop-color="#082231"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#071824" stroke="#1A4F6A" stroke-width="2"/>

  <!-- Stack layers (right side) -->
  <!-- Layer: Gateway -->
  <rect x="680" y="100" width="360" height="44" rx="8" fill="#0F3348" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="860" y="127" text-anchor="middle" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">API GATEWAY  ·  TLS  ·  AUTH  ·  WAF</text>

  <!-- Layer: Cache -->
  <rect x="680" y="156" width="360" height="44" rx="8" fill="#0F3348" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="860" y="183" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">LLM CACHE  ·  REDIS  ·  QDRANT</text>

  <!-- Layer: vLLM -->
  <rect x="680" y="212" width="360" height="44" rx="8" fill="#122B3F" stroke="#A3E635" stroke-width="2"/>
  <text x="860" y="239" text-anchor="middle" fill="#A3E635" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">vLLM  ·  PAGED ATTENTION  ·  BATCHING</text>

  <!-- Layer: GPU Compute -->
  <rect x="680" y="268" width="360" height="44" rx="8" fill="#0F3348" stroke="#BEF264" stroke-width="1.5"/>
  <text x="860" y="295" text-anchor="middle" fill="#BEF264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">GPU COMPUTE  ·  MIG  ·  KEDA</text>

  <!-- Layer: Storage -->
  <rect x="680" y="324" width="360" height="44" rx="8" fill="#0F3348" stroke="#4EAAC6" stroke-width="1.5"/>
  <text x="860" y="351" text-anchor="middle" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">MODEL STORAGE  ·  MINIO  ·  MLFLOW</text>

  <!-- Layer: Observability -->
  <rect x="680" y="380" width="360" height="44" rx="8" fill="#0F3348" stroke="#3DD5F3" stroke-width="1.5"/>
  <text x="860" y="407" text-anchor="middle" fill="#3DD5F3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">PROMETHEUS  ·  GRAFANA  ·  JAEGER</text>

  <!-- Layer: Control Plane -->
  <rect x="680" y="436" width="360" height="44" rx="8" fill="#0F3348" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="860" y="463" text-anchor="middle" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">ARGOCD  ·  VAULT  ·  ISTIO  ·  OPA</text>

  <!-- Connector arrows between layers -->
  <line x1="860" y1="144" x2="860" y2="156" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="860" y1="200" x2="860" y2="212" stroke="#67E8F9" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="860" y1="256" x2="860" y2="268" stroke="#A3E635" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="860" y1="312" x2="860" y2="324" stroke="#BEF264" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="860" y1="368" x2="860" y2="380" stroke="#4EAAC6" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="860" y1="424" x2="860" y2="436" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- GPU chip grid (left side visual) -->
  <!-- Row 1 -->
  <rect x="104" y="100" width="76" height="76" rx="10" fill="#0D2E42" stroke="#22D3EE" stroke-width="2"/>
  <rect x="118" y="114" width="48" height="48" rx="6" fill="#071824" stroke="#22D3EE" stroke-width="1"/>
  <text x="142" y="143" text-anchor="middle" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <rect x="198" y="100" width="76" height="76" rx="10" fill="#0D2E42" stroke="#22D3EE" stroke-width="2"/>
  <rect x="212" y="114" width="48" height="48" rx="6" fill="#071824" stroke="#22D3EE" stroke-width="1"/>
  <text x="236" y="143" text-anchor="middle" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <rect x="292" y="100" width="76" height="76" rx="10" fill="#0D2E42" stroke="#67E8F9" stroke-width="2"/>
  <rect x="306" y="114" width="48" height="48" rx="6" fill="#071824" stroke="#67E8F9" stroke-width="1"/>
  <text x="330" y="143" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <rect x="386" y="100" width="76" height="76" rx="10" fill="#0D2E42" stroke="#67E8F9" stroke-width="2"/>
  <rect x="400" y="114" width="48" height="48" rx="6" fill="#071824" stroke="#67E8F9" stroke-width="1"/>
  <text x="424" y="143" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <!-- Row 2 -->
  <rect x="104" y="196" width="76" height="76" rx="10" fill="#0D2E42" stroke="#A3E635" stroke-width="2"/>
  <rect x="118" y="210" width="48" height="48" rx="6" fill="#071824" stroke="#A3E635" stroke-width="1"/>
  <text x="142" y="239" text-anchor="middle" fill="#A3E635" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <rect x="198" y="196" width="76" height="76" rx="10" fill="#0D2E42" stroke="#A3E635" stroke-width="2"/>
  <rect x="212" y="210" width="48" height="48" rx="6" fill="#071824" stroke="#A3E635" stroke-width="1"/>
  <text x="236" y="239" text-anchor="middle" fill="#A3E635" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <rect x="292" y="196" width="76" height="76" rx="10" fill="#0D2E42" stroke="#BEF264" stroke-width="2"/>
  <rect x="306" y="210" width="48" height="48" rx="6" fill="#071824" stroke="#BEF264" stroke-width="1"/>
  <text x="330" y="239" text-anchor="middle" fill="#BEF264" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <rect x="386" y="196" width="76" height="76" rx="10" fill="#0D2E42" stroke="#BEF264" stroke-width="2"/>
  <rect x="400" y="210" width="48" height="48" rx="6" fill="#071824" stroke="#BEF264" stroke-width="1"/>
  <text x="424" y="239" text-anchor="middle" fill="#BEF264" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">GPU</text>

  <!-- NVLink connections between GPUs row 1 -->
  <line x1="180" y1="138" x2="198" y2="138" stroke="#22D3EE" stroke-width="3"/>
  <line x1="274" y1="138" x2="292" y2="138" stroke="#67E8F9" stroke-width="3"/>
  <line x1="368" y1="138" x2="386" y2="138" stroke="#4EAAC6" stroke-width="3"/>

  <!-- NVLink connections between GPUs row 2 -->
  <line x1="180" y1="234" x2="198" y2="234" stroke="#A3E635" stroke-width="3"/>
  <line x1="274" y1="234" x2="292" y2="234" stroke="#BEF264" stroke-width="3"/>
  <line x1="368" y1="234" x2="386" y2="234" stroke="#86CC20" stroke-width="3"/>

  <!-- Cross-row connections -->
  <line x1="142" y1="176" x2="142" y2="196" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="236" y1="176" x2="236" y2="196" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="330" y1="176" x2="330" y2="196" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="424" y1="176" x2="424" y2="196" stroke="#3DD5F3" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- NVLink label -->
  <text x="284" y="292" text-anchor="middle" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="1">NVLink  ·  8× GPU NODE</text>

  <!-- Accent badge -->
  <rect x="796" y="72" width="244" height="46" rx="23" fill="url(#accent)"/>
  <text x="918" y="101" text-anchor="middle" fill="#071824" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ENTERPRISE ARCHITECTURE</text>

  <!-- Main headline -->
  <text x="104" y="400" fill="#8FD8EC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">SELF-HOSTED LLM PLATFORM</text>
  <text x="104" y="468" fill="#F4FEFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Hosting Local LLMs</text>
  <text x="104" y="528" fill="#F4FEFF" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">on Kubernetes</text>
</svg>
