<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering memory problem cover image</title>
  <desc id="desc">Abstract cover with layered memory stack and context engineering architecture headline.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1140" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140A00"/>
      <stop offset="1" stop-color="#2C1A00"/>
    </linearGradient>
    <linearGradient id="accent" x1="820" y1="72" x2="1060" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bar1" x1="108" y1="0" x2="1092" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bar2" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#EA580C" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bar3" x1="330" y1="0" x2="870" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C2410C" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bar4" x1="480" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B45309" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9A3412" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#180C00" stroke="#503010" stroke-width="2"/>
  <!-- Stacked memory layers (widest at bottom = external store, narrowest at top = active state) -->
  <rect x="108" y="298" width="984" height="52" rx="8" fill="url(#bar1)" stroke="#FBBF24" stroke-width="1.5"/>
  <rect x="200" y="238" width="800" height="48" rx="8" fill="url(#bar2)" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="330" y="180" width="540" height="48" rx="8" fill="url(#bar3)" stroke="#D97706" stroke-width="1.5"/>
  <rect x="480" y="122" width="240" height="48" rx="8" fill="url(#bar4)" stroke="#B45309" stroke-width="1.5"/>
  <!-- Layer labels (right-aligned inside each bar) -->
  <text x="1062" y="329" text-anchor="end" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">EXTERNAL LONG-TERM STORE</text>
  <text x="970" y="269" text-anchor="end" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">SESSION MEMORY</text>
  <text x="840" y="211" text-anchor="end" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">SHORT-TERM CONTEXT</text>
  <text x="688" y="153" text-anchor="end" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ACTIVE STATE</text>
  <!-- Left bracket or indicator lines -->
  <line x1="96" y1="120" x2="96" y2="352" stroke="#FBBF24" stroke-width="2" opacity="0.5"/>
  <line x1="96" y1="120" x2="106" y2="120" stroke="#FBBF24" stroke-width="2" opacity="0.5"/>
  <line x1="96" y1="352" x2="106" y2="352" stroke="#FBBF24" stroke-width="2" opacity="0.5"/>
  <rect x="820" y="72" width="196" height="48" rx="24" fill="url(#accent)"/>
  <text x="918" y="103" text-anchor="middle" fill="#120800" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">CONTEXT</text>
  <text x="104" y="408" fill="#C07820" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">MEMORY ARCHITECTURE</text>
  <text x="104" y="466" fill="#FFFBF0" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Context Engineering:</text>
  <text x="104" y="524" fill="#FFFBF0" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">The Memory Problem</text>
  <text x="104" y="568" fill="#C07820" font-family="Arial, Helvetica, sans-serif" font-size="22">At runtime, an agent's memory is whatever is in its context window.</text>
</svg>
