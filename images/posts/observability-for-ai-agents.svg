<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Observability for AI Agents cover image</title>
  <desc id="desc">Abstract cover with signal histogram timeline and observability operations headline.</desc>
  <defs>
