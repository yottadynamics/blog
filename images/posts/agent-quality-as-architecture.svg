<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Quality as Architecture cover image</title>
  <desc id="desc">Abstract cover with quality flywheel cycle diagram and agent quality architecture headline.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1140" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#100C00"/>
      <stop offset="1" stop-color="#281E00"/>
    </linearGradient>
    <linearGradient id="accent" x1="820" y1="72" x2="1060" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#141000" stroke="#4A3800" stroke-width="2"/>
  <!-- Quality Flywheel: 4 boxes in cycle with arrows -->
  <!-- Box: DEFINE (top-left) -->
  <rect x="310" y="100" width="180" height="68" rx="12" fill="#1C1600" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="400" y="138" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DEFINE</text>
  <!-- Box: INSTRUMENT (top-right) -->
  <rect x="710" y="100" width="180" height="68" rx="12" fill="#1C1600" stroke="#FBBF24" stroke-width="2.5"/>
  <text x="800" y="138" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">INSTRUMENT</text>
  <!-- Box: EVALUATE (bottom-right) -->
  <rect x="710" y="268" width="180" height="68" rx="12" fill="#1C1600" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="800" y="306" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">EVALUATE</text>
  <!-- Box: FEED BACK (bottom-left) -->
  <rect x="310" y="268" width="180" height="68" rx="12" fill="#1C1600" stroke="#FBBF24" stroke-width="2.5"/>
  <text x="400" y="306" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">FEED BACK</text>
  <!-- Arrows forming clockwise cycle -->
  <!-- DEFINE → INSTRUMENT (top, left to right) -->
  <line x1="490" y1="134" x2="706" y2="134" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="702,127 718,134 702,141" fill="#F59E0B"/>
  <!-- INSTRUMENT → EVALUATE (right, top to bottom) -->
  <line x1="800" y1="168" x2="800" y2="264" stroke="#FBBF24" stroke-width="2.5"/>
  <polygon points="793,260 800,276 807,260" fill="#FBBF24"/>
  <!-- EVALUATE → FEED BACK (bottom, right to left) -->
  <line x1="706" y1="302" x2="494" y2="302" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="498,295 482,302 498,309" fill="#F59E0B"/>
  <!-- FEED BACK → DEFINE (left, bottom to top) -->
  <line x1="400" y1="268" x2="400" y2="172" stroke="#FBBF24" stroke-width="2.5"/>
  <polygon points="393,176 400,160 407,176" fill="#FBBF24"/>
  <!-- Center element -->
  <circle cx="600" cy="218" r="32" fill="#1C1600" stroke="#D97706" stroke-width="2"/>
  <text x="600" y="214" text-anchor="middle" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">QUALITY</text>
  <text x="600" y="228" text-anchor="middle" fill="#FCD34D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">FLYWHEEL</text>
  <rect x="820" y="72" width="196" height="48" rx="24" fill="url(#accent)"/>
  <text x="918" y="103" text-anchor="middle" fill="#100800" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">QUALITY</text>
  <text x="104" y="408" fill="#B07820" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AGENT QUALITY</text>
  <text x="104" y="466" fill="#FFFDF0" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Agent Quality</text>
  <text x="104" y="524" fill="#FFFDF0" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">as Architecture</text>
  <text x="104" y="568" fill="#B07820" font-family="Arial, Helvetica, sans-serif" font-size="22">Why you can't bolt quality on after the agent is already built.</text>
</svg>
