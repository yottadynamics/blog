  <text x="769" y="138" text-anchor="middle" fill="#34D399" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">gemma3</text>
  <text x="769" y="162" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="12">general-purpose</text>

  <rect x="866" y="110" width="150" height="74" rx="12" fill="#102838" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="941" y="138" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">qwen2.5</text>
  <text x="941" y="162" text-anchor="middle" fill="#FEF3C7" font-family="Arial, Helvetica, sans-serif" font-size="12">coding + JSON</text>

