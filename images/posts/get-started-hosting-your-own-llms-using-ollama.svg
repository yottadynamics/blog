<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Get Started Hosting Your Own LLMs Using Ollama cover image</title>
  <desc id="desc">Abstract cover with a local terminal, model cards, and a private AI workflow theme.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="40" x2="1160" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081018"/>
      <stop offset="1" stop-color="#123448"/>
    </linearGradient>
    <linearGradient id="accent" x1="780" y1="72" x2="1070" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="110" x2="620" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1C28"/>
      <stop offset="1" stop-color="#102636"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#081722" stroke="#24506B" stroke-width="2"/>

