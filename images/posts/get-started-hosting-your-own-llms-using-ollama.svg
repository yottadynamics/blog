  <text x="370" y="119" text-anchor="middle" fill="#7FB1C8" font-family="monospace, Courier New" font-size="12">ollama — local terminal</text>

  <text x="130" y="160" fill="#34D399" font-family="monospace, Courier New" font-size="14">$ ollama run gemma3</text>
  <text x="130" y="186" fill="#CDEAF4" font-family="monospace, Courier New" font-size="13" opacity="0.9">pulling manifest ...</text>
  <text x="130" y="210" fill="#CDEAF4" font-family="monospace, Courier New" font-size="13" opacity="0.9">pulling layers ...</text>
  <text x="130" y="234" fill="#86EFAC" font-family="monospace, Courier New" font-size="13">success</text>
  <text x="130" y="266" fill="#FDE68A" font-family="monospace, Courier New" font-size="13">&gt;&gt;&gt; Explain local LLM hosting in plain English</text>
  <text x="130" y="296" fill="#D9F3FF" font-family="monospace, Courier New" font-size="13" opacity="0.95">You run the model on your own machine, keep the data local,</text>
  <text x="130" y="318" fill="#D9F3FF" font-family="monospace, Courier New" font-size="13" opacity="0.95">and expose a simple API for your apps and tools.</text>

