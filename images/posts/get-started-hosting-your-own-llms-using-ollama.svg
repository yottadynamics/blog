  <text x="857" y="391" text-anchor="middle" fill="#D9F3FF" font-family="Arial, Helvetica, sans-serif" font-size="11">Local API</text>
  <rect x="912" y="378" width="78" height="18" rx="9" fill="#133245"/>
  <text x="951" y="391" text-anchor="middle" fill="#D9F3FF" font-family="Arial, Helvetica, sans-serif" font-size="11">Response</text>

  <rect x="780" y="72" width="244" height="48" rx="24" fill="url(#accent)"/>
  <text x="902" y="103" text-anchor="middle" fill="#07131B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3">OLLAMA QUICKSTART</text>

  <text x="104" y="420" fill="#8CD6C4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">LOCAL LLMs</text>
  <text x="104" y="478" fill="#F2FCFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Get Started Hosting</text>
  <text x="104" y="534" fill="#F2FCFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Your Own LLMs Using Ollama</text>
  <text x="104" y="570" fill="#8AAFC3" font-family="Arial, Helvetica, sans-serif" font-size="21">Private AI, local models, Modelfiles, and a clean on-ramp for builders.</text>
