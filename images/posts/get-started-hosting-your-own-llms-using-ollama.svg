  <text x="769" y="230" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">llama3.2</text>
  <text x="769" y="254" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="12">small + local</text>

  <rect x="866" y="202" width="150" height="74" rx="12" fill="#102838" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="941" y="230" text-anchor="middle" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">mistral</text>
  <text x="941" y="254" text-anchor="middle" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="12">fast + lightweight</text>

  <rect x="694" y="312" width="322" height="96" rx="16" fill="#0F2230" stroke="#2D6484" stroke-width="1.5"/>
