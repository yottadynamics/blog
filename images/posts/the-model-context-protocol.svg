<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Model Context Protocol cover image</title>
  <desc id="desc">Abstract cover with hub-and-spoke tool integration diagram and MCP integration headline.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1140" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04140E"/>
      <stop offset="1" stop-color="#0A2C1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="820" y1="72" x2="1060" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#061810" stroke="#1A4030" stroke-width="2"/>
  <!-- Hub-and-spoke: central MCP node with 5 tool nodes -->
  <circle cx="600" cy="215" r="56" fill="#0C2A18" stroke="#34D399" stroke-width="3.5"/>
  <text x="600" y="211" text-anchor="middle" fill="#6EE7B7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">MCP</text>
  <text x="600" y="228" text-anchor="middle" fill="#6EE7B7" font-family="Arial, Helvetica, sans-serif" font-size="12">SERVER</text>
  <!-- Spoke 1: top -->
  <line x1="600" y1="159" x2="600" y2="100" stroke="#34D399" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="600" cy="86" r="28" fill="#0C2A18" stroke="#34D399" stroke-width="2"/>
  <text x="600" y="91" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">SEARCH</text>
  <!-- Spoke 2: top-right -->
  <line x1="647" y1="172" x2="820" y2="110" stroke="#10B981" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="848" cy="100" r="28" fill="#0C2A18" stroke="#10B981" stroke-width="2"/>
  <text x="848" y="105" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">DATABASE</text>
  <!-- Spoke 3: right -->
  <line x1="656" y1="215" x2="948" y2="215" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="976" cy="215" r="28" fill="#0C2A18" stroke="#06B6D4" stroke-width="2"/>
  <text x="976" y="220" text-anchor="middle" fill="#A5F3FC" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">API</text>
  <!-- Spoke 4: bottom-right -->
  <line x1="640" y1="258" x2="810" y2="318" stroke="#10B981" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="838" cy="330" r="28" fill="#0C2A18" stroke="#10B981" stroke-width="2"/>
  <text x="838" y="335" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">FILES</text>
  <!-- Spoke 5: left -->
  <line x1="544" y1="215" x2="252" y2="215" stroke="#34D399" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="224" cy="215" r="28" fill="#0C2A18" stroke="#34D399" stroke-width="2"/>
  <text x="224" y="220" text-anchor="middle" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">ACTIONS</text>
  <rect x="820" y="72" width="196" height="48" rx="24" fill="url(#accent)"/>
  <text x="918" y="103" text-anchor="middle" fill="#020C06" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">MCP</text>
  <text x="104" y="408" fill="#34A870" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">INTEGRATION</text>
  <text x="104" y="466" fill="#F0FFF8" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">The Model Context Protocol</text>
  <text x="104" y="524" fill="#F0FFF8" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">How Agents Connect</text>
  <text x="104" y="568" fill="#34A870" font-family="Arial, Helvetica, sans-serif" font-size="22">Standard tool discovery and invocation — N+M instead of N×M.</text>
</svg>
