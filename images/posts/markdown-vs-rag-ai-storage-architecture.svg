<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Markdown vs RAG AI Storage Architecture cover image</title>
  <desc id="desc">Abstract cover showing Markdown document structure on the left and a RAG retrieval pipeline on the right, illustrating the two approaches to AI knowledge storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050F1A"/>
      <stop offset="1" stop-color="#0D1F35"/>
    </linearGradient>
    <linearGradient id="accent" x1="796" y1="72" x2="1062" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="mdgrad" x1="104" y1="100" x2="104" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D2235"/>
      <stop offset="1" stop-color="#071824"/>
    </linearGradient>
    <linearGradient id="raggrad" x1="630" y1="100" x2="630" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A0D35"/>
      <stop offset="1" stop-color="#0F0720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#071824" stroke="#1A3A5C" stroke-width="2"/>

  <!-- ── LEFT PANEL: MARKDOWN ── -->

  <!-- Panel label -->
  <text x="134" y="104" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MARKDOWN  ·  DIRECT INGESTION</text>

  <!-- Document outer frame -->
  <rect x="104" y="116" width="460" height="310" rx="12" fill="#071F30" stroke="#22D3EE" stroke-width="1.5"/>

  <!-- Heading H1 bar -->
  <rect x="124" y="136" width="12" height="30" rx="2" fill="#22D3EE"/>
  <rect x="144" y="141" width="200" height="10" rx="3" fill="#22D3EE" opacity="0.9"/>
  <rect x="144" y="156" width="140" height="8" rx="3" fill="#1A4F6A" opacity="0.7"/>

  <!-- Heading H2 bar -->
  <rect x="124" y="182" width="8" height="8" rx="1" fill="#67E8F9"/>
  <rect x="124" y="193" width="8" height="8" rx="1" fill="#67E8F9"/>
  <rect x="140" y="186" width="160" height="9" rx="3" fill="#67E8F9" opacity="0.8"/>
  <!-- body lines -->
  <rect x="140" y="202" width="320" height="7" rx="2" fill="#1E4A62" opacity="0.8"/>
  <rect x="140" y="214" width="280" height="7" rx="2" fill="#1E4A62" opacity="0.6"/>
  <rect x="140" y="226" width="300" height="7" rx="2" fill="#1E4A62" opacity="0.5"/>

  <!-- Heading H3 bar -->
  <rect x="140" y="250" width="6" height="6" rx="1" fill="#4EAAC6"/>
  <rect x="140" y="259" width="6" height="6" rx="1" fill="#4EAAC6"/>
  <rect x="140" y="268" width="6" height="6" rx="1" fill="#4EAAC6"/>
  <rect x="154" y="253" width="130" height="8" rx="3" fill="#4EAAC6" opacity="0.8"/>
  <!-- body lines -->
  <rect x="154" y="268" width="290" height="7" rx="2" fill="#1E4A62" opacity="0.7"/>
  <rect x="154" y="280" width="250" height="7" rx="2" fill="#1E4A62" opacity="0.5"/>

  <!-- Code block -->
  <rect x="124" y="300" width="420" height="56" rx="6" fill="#051018" stroke="#1A4F6A" stroke-width="1"/>
  <rect x="134" y="310" width="60" height="8" rx="2" fill="#A3E635" opacity="0.7"/>
  <rect x="134" y="323" width="180" height="7" rx="2" fill="#3DD5F3" opacity="0.6"/>
  <rect x="134" y="336" width="140" height="7" rx="2" fill="#3DD5F3" opacity="0.5"/>
  <rect x="134" y="349" width="100" height="7" rx="2" fill="#67E8F9" opacity="0.4"/>

  <!-- Token efficiency badge -->
  <rect x="124" y="374" width="420" height="36" rx="8" fill="#0A2535" stroke="#22D3EE" stroke-width="1"/>
  <text x="144" y="396" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">5% token overhead  ·  95% semantic signal  ·  &lt;100MB: zero latency</text>

  <!-- ── MIDDLE: VS DIVIDER ── -->
  <line x1="578" y1="116" x2="578" y2="426" stroke="#1A3A5C" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="554" y="256" width="48" height="28" rx="14" fill="#0D1F35" stroke="#2A5A8A" stroke-width="1.5"/>
  <text x="578" y="275" text-anchor="middle" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">VS</text>

  <!-- ── RIGHT PANEL: RAG PIPELINE ── -->

  <!-- Panel label -->
  <text x="630" y="104" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">RAG  ·  VECTOR RETRIEVAL PIPELINE</text>

  <!-- Stage 1: Query -->
  <rect x="618" y="116" width="430" height="44" rx="8" fill="#1A0D35" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="638" y="138" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">QUERY</text>
  <text x="730" y="138" fill="#7C5FC4" font-family="Arial, Helvetica, sans-serif" font-size="11">user question or agent prompt</text>
  <text x="1010" y="138" text-anchor="end" fill="#5B3FA0" font-family="Arial, Helvetica, sans-serif" font-size="11">—</text>

  <line x1="833" y1="160" x2="833" y2="172" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Stage 2: Embed -->
  <rect x="618" y="172" width="430" height="44" rx="8" fill="#160A2E" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="638" y="194" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">EMBED</text>
  <text x="712" y="194" fill="#9270D4" font-family="Arial, Helvetica, sans-serif" font-size="11">text-embedding model  ·  dense vector</text>
  <text x="1040" y="194" text-anchor="end" fill="#7C5FC4" font-family="Arial, Helvetica, sans-serif" font-size="11">~10ms</text>

  <line x1="833" y1="216" x2="833" y2="228" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Stage 3: Hybrid Search -->
  <rect x="618" y="228" width="430" height="52" rx="8" fill="#160A2E" stroke="#7C3AED" stroke-width="2"/>
  <text x="638" y="250" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">HYBRID SEARCH</text>
  <text x="638" y="268" fill="#7C5FC4" font-family="Arial, Helvetica, sans-serif" font-size="11">dense vector (ANN)  +  BM25 keyword  →  RRF fusion</text>
  <text x="1040" y="259" text-anchor="end" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="11">~26ms</text>

  <line x1="833" y1="280" x2="833" y2="292" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Stage 4: Rerank -->
  <rect x="618" y="292" width="430" height="44" rx="8" fill="#160A2E" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="638" y="314" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">RERANK</text>
  <text x="712" y="314" fill="#9270D4" font-family="Arial, Helvetica, sans-serif" font-size="11">cross-encoder  ·  top-k → top-n</text>
  <text x="1040" y="314" text-anchor="end" fill="#7C5FC4" font-family="Arial, Helvetica, sans-serif" font-size="11">~80ms</text>

  <line x1="833" y1="336" x2="833" y2="348" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Stage 5: Context -->
  <rect x="618" y="348" width="430" height="44" rx="8" fill="#0A1F10" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="638" y="370" fill="#4ADE80" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CONTEXT ASSEMBLY</text>
  <text x="790" y="370" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="11">inject top-n chunks into prompt</text>
  <text x="1040" y="370" text-anchor="end" fill="#4ADE80" font-family="Arial, Helvetica, sans-serif" font-size="11">&lt;130ms total</text>

  <!-- Accuracy lift badge -->
  <rect x="618" y="404" width="430" height="22" rx="6" fill="#0A1020" stroke="#7C3AED" stroke-width="1"/>
  <text x="638" y="419" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">structure-aware chunking → 40–60% accuracy lift  ·  hybrid search → 67% relevance gain</text>

  <!-- Accent badge -->
  <rect x="796" y="70" width="290" height="40" rx="20" fill="url(#accent)"/>
  <text x="941" y="95" text-anchor="middle" fill="#050F1A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AI STORAGE ARCHITECTURE</text>

  <!-- Main headline -->
  <text x="104" y="474" fill="#4EAAC6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">THE TECHNICAL BLUEPRINT FOR AI SPEED</text>
  <text x="104" y="540" fill="#F4FEFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Markdown</text>
  <text x="104" y="600" fill="#F4FEFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">vs. <tspan fill="#A78BFA">RAG</tspan></text>
</svg>
